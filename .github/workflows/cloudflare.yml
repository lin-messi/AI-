name: Cloudflare 构建与部署

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "data/**"
      - "worker/**"
      - "scripts/**"
      - "tests/**"
      - "public/**"
      - "package*.json"
      - "jsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN commits do not trigger another push workflow.
  # These completion events deploy the data committed by the existing jobs.
  workflow_run:
    workflows: ["每日抓取 AI 新闻", "抓取 RoboMaster 规则入口与目录", "监测 RoboMaster 规则更新"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run must build current main, never execute an artifact or branch from the triggering run.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
      - run: npm run test:cloudflare
      - name: 验证 Worker 包
        run: npx wrangler deploy --dry-run
      - name: 部署到 Cloudflare
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_run')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::构建已验证；请配置 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID 后手动运行本工作流上线。"
            exit 0
          fi
          npx wrangler deploy
